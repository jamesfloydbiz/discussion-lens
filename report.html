<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Discussion Lens</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="./">Discussion Lens</a>
    </div>
  </header>

  <main class="wrap">
    <p id="loadStatus" class="status" role="status" aria-live="polite">Loading…</p>

    <div id="report" hidden>
      <section class="report-head">
        <label class="sr-only" for="titleInput">Title</label>
        <input id="titleInput" class="title-input" type="text" maxlength="140">
        <div id="facts" class="facts"></div>
        <p id="sampleNote" class="notice warn no-print" hidden>Scripted sample. Edits here are not saved.</p>
        <h2 class="sr-only">Speakers</h2>
        <!-- COPY: James -->
        <p class="muted no-print" style="font-size:.9rem">Name each speaker. If one person was split in two, merge them.</p>
        <div id="speakerEdit" class="speaker-edit"></div>
      </section>

      <section class="card" aria-labelledby="groupTitle">
        <h2 id="groupTitle">Group</h2>
        <h3>Talk share</h3>
        <div id="shareBar"></div>
        <h3 style="margin-top: 20px">Who spoke when</h3>
        <div id="timeline" class="timeline"></div>
      </section>

      <section aria-labelledby="peopleTitle">
        <h2 id="peopleTitle">People</h2>
        <div id="people" class="people"></div>
      </section>

      <section class="card">
        <details id="transcriptBox">
          <summary><h2>Full transcript</h2> <span id="turnCount" class="muted"></span></summary>
          <div id="transcript"></div>
        </details>
      </section>
    </div>
  </main>

  <script type="module" src="js/report.js"></script>
</body>
</html>
